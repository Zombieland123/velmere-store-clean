async function ungzip(b64){const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const stream=new Blob([bytes]).stream().pipeThrough(ds);return await new Response(stream).text();}
function toast(msg){const el=document.getElementById('pv-toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.__pvToast);window.__pvToast=setTimeout(()=>el.classList.remove('show'),2600);}
let ROUTES={};
function currentRoute(){let r=location.hash.replace(/^#/,'')||'/en';return ROUTES[r]?r:'/en';}
function bindPreview(){
 document.querySelectorAll('[data-preview-route]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();location.hash=a.dataset.previewRoute;}));
 document.querySelectorAll('form').forEach(f=>f.addEventListener('submit',e=>{e.preventDefault();toast('R50 preview: backend action disabled');}));
 document.querySelectorAll('button').forEach(b=>{
   const ctl=b.getAttribute('aria-controls'); if(ctl) b.addEventListener('click',()=>{const el=document.getElementById(ctl);if(el){const hidden=el.hasAttribute('hidden');hidden?el.removeAttribute('hidden'):el.setAttribute('hidden','');b.setAttribute('aria-expanded',hidden?'true':'false');}});
 });
 document.querySelectorAll('a[href^="/api/"],button[data-preview-api]').forEach(x=>x.addEventListener('click',e=>{e.preventDefault();toast('R50 preview: external service disabled');}));
}
function renderRoute(){const r=currentRoute();document.body.querySelectorAll(':scope > *:not(#pv-toast)').forEach(n=>n.remove());const host=document.createElement('div');host.id='pv-route';host.innerHTML=ROUTES[r];document.body.insertBefore(host,document.getElementById('pv-toast'));document.title='Velmère R50 · '+r;window.scrollTo(0,0);bindPreview();}
(async()=>{const [css,raw]=await Promise.all([ungzip(CSS_GZ),ungzip(ROUTES_GZ)]);const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);ROUTES=JSON.parse(raw);renderRoute();addEventListener('hashchange',renderRoute);})().catch(err=>{document.getElementById('boot').textContent='R50 preview failed to initialize: '+err.message;});
</script></body></html>
